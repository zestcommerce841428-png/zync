# Self-contained compose for Hostinger VPS Docker Manager (connector deploy).
# Unlike the other compose files, this one needs NO local repo files: it builds
# the app image directly from the GitHub repo via a remote git build context,
# and uses only named volumes. Deployed via the hostinger-vps connector
# (VPS_createNewProjectV1) which only fetches this file, not the whole repo.
#
# NGINX (nginx-proxy) + auto-HTTPS (acme-companion) + Redis + the app.
# PeerJS uses the public broker by default (no separate container here).

# Larger proxy/header buffers so big auth response headers (Supabase session
# cookies / JWTs) don't trip nginx's "upstream sent too big header" -> 502.
configs:
  nginx_buffers:
    content: |
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
      proxy_busy_buffers_size 64k;
      large_client_header_buffers 8 32k;
  # Redirect www → non-www at nginx level (canonical URL)
  www_redirect:
    content: "return 301 https://videodownloaders.cloud$request_uri;"

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    configs:
      - source: nginx_buffers
        target: /etc/nginx/conf.d/zzz-buffers.conf
      - source: www_redirect
        target: /etc/nginx/vhost.d/www.videodownloaders.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html

  acme:
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    environment:
      - DEFAULT_EMAIL=contact@videodownloaders.cloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    image: ghcr.io/zestcommerce841428-png/zync:latest
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=https://videodownloaders.cloud
      - ADMIN_EMAILS=zestcommerce841428@gmail.com
      # Both www and non-www are proxied; Next.js middleware redirects www→non-www
      - VIRTUAL_HOST=videodownloaders.cloud,www.videodownloaders.cloud
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=videodownloaders.cloud,www.videodownloaders.cloud
      # FILEPIZZA_SECRET, R2 credentials etc. injected via project environment
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - redis

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  certs:
  vhost:
  html:
  acme:
  redis_data:
