# Self-contained compose for Hostinger VPS Docker Manager (connector deploy).
# Unlike the other compose files, this one needs NO local repo files: it builds
# the app image directly from the GitHub repo via a remote git build context,
# and uses only named volumes. Deployed via the hostinger-vps connector
# (VPS_createNewProjectV1) which only fetches this file, not the whole repo.
#
# NGINX (nginx-proxy) + auto-HTTPS (acme-companion) + Redis + the app.
# PeerJS uses the public broker by default (no separate container here).

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html

  acme:
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    environment:
      - DEFAULT_EMAIL=contact@videodownloaders.cloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    build:
      context: "https://github.com/zestcommerce841428-png/zync.git#main"
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "https://videodownloaders.cloud"
    restart: unless-stopped
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=https://videodownloaders.cloud
      - ADMIN_EMAILS=zestcommerce841428@gmail.com
      - VIRTUAL_HOST=videodownloaders.cloud
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=videodownloaders.cloud
      # FILEPIZZA_SECRET is injected via the project environment (not committed)
    depends_on:
      - redis

volumes:
  certs:
  vhost:
  html:
  acme:
  redis_data:
