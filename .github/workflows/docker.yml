# Build the production Docker image and push it to GitHub Container Registry
# (GHCR) on every push to main and on version tags. Cloud services that watch
# the image (App Runner, Cloud Run, Container Apps, etc.) can auto-redeploy.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://videodownloaders.cloud
            NEXT_PUBLIC_SUPABASE_URL=https://dwjiznzwtgzcaacqqyyf.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3aml6bnp3dGd6Y2FhY3FxeXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODg0MjYsImV4cCI6MjA5NzM2NDQyNn0.RO2GMtvqO4cIDCuSQrE3kiC59sII8yNbcIrDsZN1vSw
            NEXT_PUBLIC_GA_ID=G-9ZB3KPK6Z8
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LduoCYtAAAAADrExlYimeg5jfHls8Yqs5a52Zu0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Watchtower on the VPS polls GHCR every 60s and restarts only the
          # app container when it sees a new :latest — nginx and acme stay up.
